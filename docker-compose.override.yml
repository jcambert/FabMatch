# Development overrides – automatically loaded by docker compose in dev environments
version: '3.9'

services:
  app:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=fabmatch_dev;Username=fabmatch;Password=fabmatch_password
    build:
      target: publish   # Don't use the slim runtime image in dev

  db:
    ports:
      - "5432:5432"

  pgadmin:
    profiles: []   # Enable pgAdmin in development (remove profile guard)
